services:
  app:
    build: ./backend
    ports: ["8080:8080"]
    volumes:
      - ./backend/data:/app/data
      - ./frontend:/app/frontend
      # Espelho opcional de backup (pendrive). Monte o pendrive aqui e
      # configure BACKUP_MIRROR_DIR=/app/mirror no .env.
      # - /media/$USER/SWIMTIMER:/app/mirror:rw
    environment:
      - FRONTEND_DIR=/app/frontend
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
