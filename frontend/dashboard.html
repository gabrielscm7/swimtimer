<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071019" />
    <title>SwimTimer — Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .dashboard-clock-label {
        text-align: center;
        color: var(--muted);
        letter-spacing: 2px;
        text-transform: uppercase;
        font-size: 0.75rem;
      }
      .remaining {
        text-align: center;
        color: var(--muted);
        font-size: 1rem;
        margin-top: -6px;
      }
      .rank-row .rank-team {
        font-size: 1.4rem;
      }
      .rank-row .rank-laps {
        font-size: 1.8rem;
      }
      .rank-row .rank-pos {
        font-size: 1.8rem;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="topbar">
        <div class="brand">Swim<span>Timer</span></div>
        <span class="badge offline" id="conn-badge">offline</span>
      </div>

      <div class="panel">
        <h2 id="heat-name" class="center">Aguardando prova</h2>
        <div class="banner-finished" id="finished-banner" hidden>🏆 PROVA ENCERRADA</div>
        <div class="dashboard-clock-label">Tempo</div>
        <div class="clock" id="clock">00:00:00</div>
        <div class="remaining" id="remaining"></div>
      </div>

      <div class="panel">
        <h2 id="ranking-title">Ranking em tempo real</h2>
        <div class="ranking" id="ranking">
          <p class="muted">Aguardando prova...</p>
        </div>
      </div>
    </main>

    <script src="/static/app.js"></script>
    <script>
      const els = {
        badge: document.getElementById("conn-badge"),
        name: document.getElementById("heat-name"),
        banner: document.getElementById("finished-banner"),
        clock: document.getElementById("clock"),
        remaining: document.getElementById("remaining"),
        rankingTitle: document.getElementById("ranking-title"),
        ranking: document.getElementById("ranking"),
      };

      let events = [];
      let currentHeat = null;
      let currentEvent = null;

      function pickCurrent() {
        const active = [];
        const ready = [];
        for (const event of events) {
          for (const heat of event.heats) {
            if (heat.status === "active") active.push({ event, heat });
            else if (heat.status === "ready_check") ready.push({ event, heat });
          }
        }
        const chosen = active[0] || ready[0] || null;
        if (chosen) {
          currentEvent = chosen.event;
          currentHeat = chosen.heat;
        }
      }

      function upsertHeat(heat) {
        const event = events.find((item) => item.id === heat.event_id);
        if (!event) return;
        const index = event.heats.findIndex((item) => item.id === heat.id);
        if (index >= 0) event.heats[index] = heat;
        else event.heats.push(heat);
        if (currentHeat && currentHeat.id === heat.id) {
          currentHeat = heat;
          currentEvent = event;
        }
      }

      function elapsed() {
        if (!currentHeat || !currentHeat.started_at) return 0;
        const end = currentHeat.finished_at || Date.now() / 1000;
        return Math.max(0, end - currentHeat.started_at);
      }

      function updateClock() {
        if (!currentHeat) {
          els.clock.textContent = "00:00:00";
          els.remaining.textContent = "";
          return;
        }
        const seconds = elapsed();
        if (currentHeat.heat_type === "bateria") {
          els.clock.textContent = formatTenths(seconds);
          els.remaining.textContent = "";
        } else {
          els.clock.textContent = formatClock(seconds);
          const remaining = Math.max(0, (currentHeat.duration_s || 0) - seconds);
          els.remaining.textContent = `restante ${formatClock(remaining)}`;
        }
      }

      function render() {
        if (!currentHeat) {
          els.name.textContent = "Aguardando prova";
          els.ranking.innerHTML = '<p class="muted">Aguardando prova...</p>';
          els.banner.hidden = true;
          currentHeat = null;
          return;
        }
        const type = currentHeat.heat_type === "bateria" ? "bateria" : "maratona";
        els.name.textContent = `${currentEvent.name} · ${currentHeat.name} (${type})`;
        els.banner.hidden = currentHeat.status !== "finished";

        const lanes = currentHeat.heat_lanes.filter(
          (lane) => lane.participant_name || lane.team_id
        );
        if (type === "bateria") {
          renderBateria(lanes);
        } else {
          renderMaratona(lanes);
        }
      }

      function renderBateria(lanes) {
        els.rankingTitle.textContent = "Resultados";
        if (!lanes.length) {
          els.ranking.innerHTML = '<p class="muted">Nenhum participante.</p>';
          return;
        }
        const finished = lanes
          .filter((lane) => lane.finish_at != null)
          .sort((a, b) => a.race_time_ms - b.race_time_ms);
        const others = lanes.filter((lane) => lane.finish_at == null);
        const rows = [...finished, ...others];

        const table = document.createElement("table");
        table.className = "results-table";
        table.innerHTML = `<thead><tr><th>Pos</th><th>Nome</th><th>Equipe</th><th>Tempo</th><th>Velocidade</th></tr></thead><tbody></tbody>`;
        const tbody = table.querySelector("tbody");
        rows.forEach((lane, index) => {
          const isFinished = lane.finish_at != null;
          const position = isFinished ? index + 1 : null;
          const time = isFinished
            ? lane.race_time_display || formatRaceTime(lane.race_time_ms)
            : lane.status === "dq"
              ? "DQ"
              : "⏱ em prova";
          const speed =
            isFinished && lane.speed_ms != null ? `${lane.speed_ms} m/s` : "—";
          const row = document.createElement("tr");
          if (isFinished && position <= 3) row.classList.add(`podium-${position}`);
          row.innerHTML = `<td class="results-pos">${position ? position + "º" : "—"}</td><td>${escapeHtml(lane.participant_name || "—")}</td><td class="muted">${escapeHtml(lane.team || "—")}</td><td class="results-time">${time}</td><td class="muted">${speed}</td>`;
          tbody.appendChild(row);
        });
        els.ranking.innerHTML = "";
        els.ranking.appendChild(table);
      }

      function renderMaratona(lanes) {
        els.rankingTitle.textContent = "Ranking em tempo real";
        if (!lanes.length) {
          els.ranking.innerHTML = '<p class="muted">Nenhuma equipe na prova.</p>';
          return;
        }
        const ordered = [...lanes].sort((a, b) => b.meters - a.meters);
        els.ranking.innerHTML = "";
        ordered.forEach((lane, index) => {
          const row = document.createElement("div");
          row.className = "rank-row";
          row.innerHTML = `
            <div class="rank-pos">${index + 1}º</div>
            <div>
              <div class="rank-team">${escapeHtml(lane.team || lane.participant_name || "Sem equipe")}</div>
              <div class="rank-lane">raia ${lane.lane_number} · ${lane.meters} m</div>
            </div>
            <div class="rank-laps">${lane.laps}</div>
            <div class="rank-meters">voltas</div>
          `;
          els.ranking.appendChild(row);
        });
      }

      async function loadEvents() {
        events = await apiFetch("/api/events");
        pickCurrent();
        render();
        updateClock();
      }

      const ws = new WSClient(wsUrl(), (message) => {
        if (message.type === "heat_state") {
          upsertHeat(message.payload);
          if (!currentHeat || currentHeat.id === message.payload.id) pickCurrent();
          render();
          updateClock();
        }
      });

      ws.onStatusChange = (connected) => {
        els.badge.classList.toggle("online", connected);
        els.badge.classList.toggle("offline", !connected);
        els.badge.textContent = connected ? "online" : "offline";
      };

      setInterval(updateClock, 100);
      loadEvents().catch(() => {});
      ws.connect();
    </script>
  </body>
</html>
