<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1117" />
    <title>SwimTimer — Gestão</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="gestao-layout">
      <aside class="sidebar" id="sidebar">
        <div class="row between">
          <div class="brand">Swim<span>Timer</span></div>
          <button class="hamburger" id="btn-hamburger" aria-label="menu">☰</button>
        </div>
        <div class="sidebar-body">
          <label for="event-name">Evento</label>
          <input class="sidebar-name" id="event-name" />
          <div style="margin: 10px 0">
            <span class="status-pill" id="event-status">—</span>
          </div>
          <nav class="sidebar-nav">
            <button data-section="overview" class="active">📋 Visão geral</button>
            <button data-section="heats">🏁 Provas e baterias</button>
            <button data-section="teams">👥 Equipes</button>
            <button data-section="athletes">🏅 Atletas</button>
            <button data-section="settings">⚙️ Configurações</button>
          </nav>
          <a href="index.html">← Home</a>
        </div>
      </aside>

      <section class="main-area" id="main">
        <div id="section-overview" class="section"></div>
        <div id="section-heats" class="section" hidden></div>
        <div id="section-teams" class="section" hidden></div>
        <div id="section-athletes" class="section" hidden></div>
        <div id="section-settings" class="section" hidden></div>
      </section>
    </main>

    <div class="modal-overlay" id="override-modal">
      <div class="modal">
        <h2>Autorizar exceção (supervisor)</h2>
        <p class="muted" id="override-message">A inscrição viola uma regra.</p>
        <label for="override-pin">PIN do supervisor</label>
        <input id="override-pin" type="password" autocomplete="off" />
        <label for="override-reason" style="margin-top:10px">Motivo da exceção</label>
        <input id="override-reason" type="text" maxlength="500"
          placeholder="Ex.: autorizado pela organização" />
        <div class="field-error" id="override-error" hidden></div>
        <div class="row" style="margin-top: 12px">
          <button style="flex: 1" id="override-cancel">Cancelar</button>
          <button style="flex: 1" class="primary" id="override-confirm">Autorizar exceção (supervisor)</button>
        </div>
      </div>
    </div>

    <script src="/static/clock_logic.js"></script>
    <script src="/static/gestao_logic.js"></script>
    <script type="module" src="/static/gestao/main.js"></script>
  </body>
</html>
