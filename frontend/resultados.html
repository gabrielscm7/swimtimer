<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1117" />
    <title>SwimTimer — Resultados</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .res-shell {
        max-width: 1500px;
        margin: 0 auto;
        padding: 16px;
      }
      .res-top {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .res-top-main {
        flex: 1;
        min-width: 240px;
      }
      .res-top h1 {
        margin: 4px 0 4px;
        font-size: 1.55rem;
        line-height: 1.2;
      }
      .res-meta {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .res-layout {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr) 340px;
        gap: 16px;
        align-items: start;
      }
      .res-side,
      .res-presentation {
        position: sticky;
        top: 12px;
        max-height: calc(100vh - 24px);
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px;
      }
      .res-side h2,
      .res-presentation h2 {
        margin: 0 0 10px;
        font-size: 0.78rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .res-prova-btn {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        color: var(--text);
        border-radius: 10px;
        padding: 9px 10px;
        margin-bottom: 5px;
        cursor: pointer;
        font: inherit;
      }
      .res-prova-btn:hover {
        background: var(--bg-2);
      }
      .res-prova-btn.active {
        border-color: var(--cyan);
        background: rgba(0, 212, 255, 0.08);
      }
      .res-prova-btn small {
        display: block;
        color: var(--muted);
        margin-top: 3px;
      }
      .res-main {
        min-width: 0;
      }
      .res-card.level-card.prova {
        border-left: 6px solid var(--lvl-prova);
      }
      .res-card.level-card.bateria,
      .res-heat.level-card.bateria {
        border-left: 2px solid var(--lvl-bateria);
      }
      .res-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 14px;
      }
      .res-card-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .res-card-head h2 {
        margin: 0;
        font-size: 1.15rem;
        flex: 1;
        min-width: 160px;
      }
      .res-badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        border: 1px solid var(--border);
        color: var(--muted);
        white-space: nowrap;
      }
      .res-badge.official {
        color: var(--green);
        border-color: rgba(16, 185, 129, 0.45);
        background: rgba(16, 185, 129, 0.12);
      }
      .res-badge.provisional {
        color: var(--amber);
        border-color: rgba(245, 158, 11, 0.45);
        background: rgba(245, 158, 11, 0.12);
      }
      .res-badge.corrected {
        color: var(--cyan);
        border-color: rgba(0, 212, 255, 0.45);
        background: rgba(0, 212, 255, 0.1);
      }
      .res-section-title {
        text-transform: uppercase;
        font-size: 0.72rem;
        letter-spacing: 0.6px;
        color: var(--muted);
        margin: 14px 0 6px;
      }
      .res-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      .res-table th,
      .res-table td {
        text-align: left;
        padding: 7px 6px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      .res-table th {
        color: var(--muted);
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .res-table td.pos {
        width: 42px;
        font-weight: 700;
        color: var(--cyan);
      }
      .res-table td.time {
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .res-heat {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 8px;
        background: var(--bg-2);
      }
      .res-heat > summary {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-weight: 600;
        list-style: none;
      }
      .res-heat > summary::-webkit-details-marker {
        display: none;
      }
      .res-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .res-actions button,
      .res-presentation button,
      .res-presentation input,
      .res-presentation select {
        font: inherit;
      }
      .res-btn {
        border: 1px solid var(--border);
        background: var(--bg-2);
        color: var(--text);
        border-radius: 9px;
        padding: 7px 10px;
        cursor: pointer;
        font-size: 0.82rem;
      }
      .res-btn:hover {
        border-color: var(--cyan);
        color: var(--cyan);
      }
      .res-btn.primary {
        background: var(--cyan);
        border-color: var(--cyan);
        color: #041018;
        font-weight: 700;
      }
      .res-btn.danger {
        color: var(--red);
        border-color: rgba(239, 68, 68, 0.4);
      }
      .res-slide {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        margin-bottom: 6px;
        background: var(--bg-2);
      }
      .res-slide.pinned {
        border-color: var(--cyan);
      }
      .res-slide-title {
        font-size: 0.84rem;
        margin-bottom: 6px;
        word-break: break-word;
      }
      .res-slide-actions {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .res-slide-actions .res-btn {
        padding: 4px 7px;
        font-size: 0.72rem;
      }
      .res-form-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
        font-size: 0.84rem;
      }
      .res-form-row input[type="number"] {
        width: 64px;
        padding: 5px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--input-bg);
        color: var(--text);
      }
      .res-message {
        background: var(--panel);
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        padding: 28px 18px;
        text-align: center;
        color: var(--muted);
      }
      .res-empty {
        color: var(--muted);
        font-size: 0.86rem;
        padding: 10px 4px;
      }
      .res-snap {
        font-size: 0.74rem;
        color: var(--muted);
        margin-top: 8px;
      }
      .res-legend {
        color: var(--muted);
        font-size: 0.78rem;
        margin: 10px 0 0;
      }
      .res-tv-strip {
        display: grid;
        grid-template-columns: minmax(0, 620px) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        margin-bottom: 16px;
      }
      .res-tv-strip h2 {
        margin: 0 0 8px;
        font-size: 0.78rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .res-tv-frame {
        position: relative;
        aspect-ratio: 16 / 9;
        width: 100%;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #000;
      }
      .res-tv-frame iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        border: 0;
        transform-origin: top left;
      }
      .res-tv-side {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      @media (max-width: 900px) {
        .res-tv-strip {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 1180px) {
        .res-layout {
          grid-template-columns: 220px minmax(0, 1fr);
        }
        .res-presentation {
          grid-column: 1 / -1;
          position: static;
          max-height: none;
        }
      }
      @media (max-width: 760px) {
        .res-layout {
          grid-template-columns: 1fr;
        }
        .res-side {
          position: static;
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="res-shell">
      <header class="res-top">
        <div class="res-top-main">
          <div class="brand">Swim<span>Timer</span></div>
          <h1 id="res-event-name">Resultados</h1>
          <div class="res-meta" id="res-event-meta"></div>
          <div class="res-meta" id="res-event-status"></div>
        </div>
        <div class="res-actions">
          <a class="res-btn" href="index.html">← Home</a>
          <a class="res-btn" id="res-public-link" target="_blank" rel="noopener">Abrir telão ↗</a>
          <a class="res-btn" id="res-export-link">Exportar CSV</a>
          <button class="res-btn" id="res-audit">Verificar auditoria</button>
        </div>
      </header>

      <div id="res-status" class="res-message" hidden></div>

      <section class="res-tv-strip">
        <div>
          <h2>Prévia do telão</h2>
          <div class="res-tv-frame" id="res-tv-frame">
            <iframe
              id="res-tv-preview"
              title="Prévia do telão"
              loading="lazy"
            ></iframe>
          </div>
        </div>
        <div class="res-tv-side">
          <h2>Ao vivo, sem recarregar</h2>
          <p class="res-legend" style="margin: 0">
            Mostra o telão em 1920×1080 escalado. A prévia não altera o estado
            do servidor; a prova ao vivo continua tendo prioridade.
          </p>
          <div class="res-actions" style="margin-top: 0">
            <button class="res-btn primary" id="res-send-tv">
              Enviar ao telão agora
            </button>
          </div>
          <p class="res-legend" id="res-send-tv-hint" style="margin: 0"></p>
        </div>
      </section>

      <div class="res-layout">
        <aside class="res-side">
          <h2>Provas</h2>
          <div id="res-provas"></div>
        </aside>

        <section class="res-main" id="res-detail">
          <div class="res-message">Carregando resultados…</div>
        </section>

        <aside class="res-presentation">
          <h2>Apresentação do telão</h2>
          <div id="res-presentation"></div>
        </aside>
      </div>
    </main>

    <script src="/static/common/labels.js"></script>
    <script type="module" src="/static/results.js"></script>
  </body>
</html>
