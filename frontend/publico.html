<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1117" />
    <title>SwimTimer — Público</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      :root {
        --pub-font-scale: 1;
        --podium-gold: #facc15;
        --podium-silver: #cbd5e1;
        --podium-bronze: #d97706;
        --pub-fs-name: max(calc(3.4vh * var(--pub-font-scale)), 22px);
        --pub-fs-time: max(calc(3.4vh * var(--pub-font-scale)), 22px);
        --pub-fs-label: max(calc(2.2vh * var(--pub-font-scale)), 22px);
        --pub-fs-small: max(calc(2.2vh * var(--pub-font-scale)), 22px);
        --pub-fs-title: max(calc(4vh * var(--pub-font-scale)), 28px);
        --pub-fs-clock: max(calc(6vh * var(--pub-font-scale)), 40px);
        --pub-row-h: max(5.6vh, 40px);
        --pub-gap: max(0.9vh, 8px);
        --pub-pad: max(1.6vh, 12px);
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        cursor: default;
        background: radial-gradient(
          circle at top,
          var(--bg-2) 0%,
          var(--bg) 60%
        );
      }
      #pub-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-color: transparent;
        background-image: var(--pub-bg-image, none);
        background-repeat: no-repeat;
        background-position: var(--pub-bg-position, center);
        background-size: var(--pub-bg-size, cover);
        opacity: var(--pub-bg-opacity, 1);
      }
      #pub-stage {
        position: relative;
        z-index: 1;
        height: 100vh;
        width: 100vw;
        padding: var(--pub-pad) max(1.6vw, 18px);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: var(--pub-gap);
        overflow: hidden;
        transition: opacity 320ms ease;
        opacity: 1;
      }
      #pub-stage.pub-select {
        display: block;
        overflow: auto;
      }
      .pub-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2vw;
        min-width: 0;
        padding-bottom: max(0.9vh, 6px);
        border-bottom: 2px solid var(--border);
      }
      .pub-head-event {
        display: flex;
        align-items: center;
        gap: max(1vw, 10px);
        min-width: 0;
        flex: 1;
      }
      .pub-event-logo {
        display: block;
        max-height: max(7vh, 36px);
        max-width: min(16vw, 220px);
        object-fit: contain;
        flex: none;
      }
      .pub-head-text {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .pub-head-name {
        font-size: var(--pub-fs-label);
        font-weight: 800;
        line-height: 1.15;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pub-head-meta {
        color: var(--muted);
        font-size: var(--pub-fs-small);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pub-head-chips {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: max(0.8vw, 8px);
        flex-wrap: wrap;
        min-width: 0;
        flex: none;
        max-width: 54vw;
        overflow: hidden;
      }
      #pub-stage .level-chip {
        display: block;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: var(--pub-fs-small);
        padding: 0.24em 0.7em;
      }
      .pub-clock {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-variant-numeric: tabular-nums;
        font-size: var(--pub-fs-clock);
        font-weight: 800;
        color: var(--cyan);
        line-height: 1;
        white-space: nowrap;
      }
      .pub-clock-small {
        color: var(--muted);
        font-size: var(--pub-fs-small);
      }
      .pub-body {
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: var(--pub-gap);
      }
      .pub-body-center {
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .pub-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2vw;
        min-height: max(3.4vh, 26px);
        padding-top: max(0.8vh, 6px);
        border-top: 2px solid var(--border);
        color: var(--muted);
        font-size: var(--pub-fs-small);
        line-height: 1.1;
      }
      .pub-foot-text,
      .pub-foot-next {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .pub-foot-next {
        color: var(--cyan);
        font-weight: 700;
      }
      .pub-foot-page {
        color: var(--cyan);
        font-weight: 800;
        white-space: nowrap;
        flex: none;
        font-variant-numeric: tabular-nums;
      }
      .pub-title {
        font-size: var(--pub-fs-title);
        font-weight: 800;
        line-height: 1.12;
        margin: 0;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pub-subtitle {
        color: var(--muted);
        font-size: var(--pub-fs-small);
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pub-section-title {
        display: block;
        color: var(--lvl-prova);
        font-size: var(--pub-fs-small);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pub-upcoming {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: var(--pub-pad) max(1.6vw, 20px);
        width: 100%;
      }
      .pub-up-item {
        display: grid;
        grid-template-columns: 2em minmax(0, 1.7fr) minmax(0, 1fr);
        align-items: baseline;
        gap: 0.8em;
        padding: max(0.6vh, 6px) 0;
        font-size: var(--pub-fs-label);
        border-bottom: 1px solid var(--border);
        text-align: left;
        min-width: 0;
      }
      .pub-up-item:last-child {
        border-bottom: none;
      }
      .pub-up-name,
      .pub-up-team {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pub-up-team {
        color: var(--muted);
      }
      .pub-up-num {
        color: var(--cyan);
        font-weight: 800;
        min-width: 1.8em;
        flex: none;
      }
      .pub-waiting {
        color: var(--muted);
        font-size: var(--pub-fs-label);
        display: flex;
        align-items: center;
        gap: 0.6em;
        justify-content: center;
      }
      .pub-waiting .dot {
        animation: pub-dot 1.4s ease-in-out infinite;
      }
      @keyframes pub-dot {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .pub-lane-grid {
        display: grid;
        grid-template-columns: repeat(
          auto-fit,
          minmax(min(20vw, 300px), 1fr)
        );
        gap: max(1vh, 8px) max(1vw, 10px);
        width: 100%;
        min-height: 0;
        overflow: hidden;
      }
      .pub-lane-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: max(1vh, 8px) max(1vw, 14px);
        min-width: 0;
      }
      .pub-lane-num {
        color: var(--lvl-bateria);
        font-weight: 800;
        font-size: var(--pub-fs-small);
        letter-spacing: 0.06em;
      }
      .pub-lane-name {
        font-size: var(--pub-fs-name);
        font-weight: 700;
        margin-top: 0.15em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pub-lane-team {
        color: var(--muted);
        font-size: var(--pub-fs-small);
        margin-top: 0.1em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pub-table {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
        width: 100%;
      }
      .pub-thead,
      .pub-trow {
        display: grid;
        gap: var(--pub-gap);
        align-items: center;
        min-width: 0;
      }
      .pub-thead {
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: var(--pub-fs-small);
        font-weight: 700;
        border-bottom: 2px solid var(--border);
        padding: max(0.5vh, 4px) max(0.8vw, 10px);
        min-height: max(3.6vh, 30px);
      }
      .pub-trow {
        border-bottom: 1px solid var(--border);
        padding: max(0.4vh, 3px) max(0.8vw, 10px);
        min-height: var(--pub-row-h);
      }
      .pub-battery .pub-thead,
      .pub-battery .pub-trow {
        grid-template-columns:
          minmax(max-content, 0.5fr)
          minmax(0, 2.5fr)
          minmax(0, 1.4fr)
          minmax(max-content, 0.9fr)
          minmax(max-content, 0.7fr);
      }
      .pub-battery.pub-compact .pub-thead,
      .pub-battery.pub-compact .pub-trow {
        grid-template-columns:
          minmax(max-content, 0.5fr)
          minmax(0, 2.6fr)
          minmax(0, 1.6fr)
          minmax(max-content, 0.9fr);
      }
      .pub-marathon .pub-thead,
      .pub-marathon .pub-trow {
        grid-template-columns:
          minmax(max-content, 0.5fr)
          minmax(0, 2.4fr)
          minmax(8ch, 0.8fr)
          minmax(max-content, 0.7fr)
          minmax(max-content, 0.8fr);
      }
      .pub-marathon.pub-compact .pub-thead,
      .pub-marathon.pub-compact .pub-trow {
        grid-template-columns:
          minmax(max-content, 0.5fr)
          minmax(0, 2.4fr)
          minmax(8ch, 0.8fr)
          minmax(max-content, 0.7fr);
      }
      .pub-cols {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0 2.2vw;
        min-height: 0;
        overflow: hidden;
      }
      .pub-cols[data-cols="2"] {
        grid-template-columns: 1fr 1fr;
      }
      .pub-col {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .pub-col .pub-thead,
      .pub-col .pub-trow {
        grid-template-columns:
          minmax(max-content, 0.5fr)
          minmax(0, 2.6fr)
          minmax(0, 1.6fr)
          minmax(max-content, 0.9fr);
      }
      .pub-section {
        min-height: 0;
        overflow: hidden;
        min-width: 0;
      }
      .pub-pos {
        font-size: var(--pub-fs-time);
        font-weight: 800;
        color: var(--muted);
        text-align: center;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .pub-pos.gold {
        color: var(--podium-gold);
      }
      .pub-pos.silver {
        color: var(--podium-silver);
      }
      .pub-pos.bronze {
        color: var(--podium-bronze);
      }
      .pub-name {
        font-size: var(--pub-fs-name);
        font-weight: 700;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pub-team {
        font-size: var(--pub-fs-small);
        color: var(--muted);
        min-width: 0;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #pub-stage .level-chip .level-icon {
        margin-right: 0.4em;
      }
      .pub-time {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-variant-numeric: tabular-nums;
        font-size: var(--pub-fs-time);
        font-weight: 700;
        color: var(--text);
        text-align: right;
        white-space: nowrap;
      }
      .pub-speed {
        font-size: var(--pub-fs-small);
        color: var(--muted);
        text-align: right;
        white-space: nowrap;
      }
      .pub-thead .right {
        text-align: right;
      }
      .pub-trow.finished {
        background: rgba(0, 212, 255, 0.06);
      }
      .pub-trow.running {
        animation: pub-row-pulse 2s ease-in-out infinite;
      }
      @keyframes pub-row-pulse {
        0%,
        100% {
          background: transparent;
        }
        50% {
          background: rgba(255, 255, 255, 0.03);
        }
      }
      .pub-trow.dq {
        opacity: 0.6;
      }
      .pub-dq-badge {
        display: inline-block;
        background: var(--red);
        color: #fff;
        font-size: var(--pub-fs-small);
        font-weight: 800;
        padding: 0.05em 0.5em;
        border-radius: 999px;
      }
      .pub-podium {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: max(1.4vw, 14px);
        flex: none;
      }
      .pub-podium-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: max(1vh, 8px) max(1.4vw, 16px);
        text-align: center;
        min-width: min(20vw, 240px);
        max-width: 32vw;
      }
      .pub-podium-card.place-1 {
        border-color: var(--podium-gold);
        transform: scale(1.06);
      }
      .pub-podium-card.place-2 {
        border-color: var(--podium-silver);
      }
      .pub-podium-card.place-3 {
        border-color: var(--podium-bronze);
      }
      .pub-podium-medal {
        font-size: var(--pub-fs-title);
      }
      .pub-podium-name {
        font-size: var(--pub-fs-name);
        font-weight: 800;
        margin-top: 0.1em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pub-podium-team {
        color: var(--muted);
        font-size: var(--pub-fs-small);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pub-podium-result {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--cyan);
        font-size: var(--pub-fs-time);
        font-weight: 700;
        margin-top: 0.1em;
        white-space: nowrap;
      }
      .pub-result-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2vw;
        min-width: 0;
      }
      .pub-result-meta > .pub-title {
        flex: 1;
      }
      .pub-interval {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: max(1.4vw, 16px);
        min-height: 0;
        overflow: hidden;
        width: 100%;
      }
      .pub-interval-col {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: max(1vh, 8px) max(1.2vw, 14px);
        min-height: 0;
        min-width: 0;
        overflow: hidden;
      }
      .pub-interval-col .pub-trow {
        min-height: max(4.6vh, 32px);
      }
      .pub-heat-cards {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0 max(1.4vw, 16px);
        min-height: 0;
        overflow: hidden;
      }
      .pub-heat-cards[data-cols="2"] {
        grid-template-columns: 1fr 1fr;
      }
      .pub-heat-cards[data-cols="3"] {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .pub-heat-card {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .pub-heat-card .pub-heat-name {
        font-size: var(--pub-fs-small);
        color: var(--lvl-bateria);
        font-weight: 800;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 0.25em;
      }
      .pub-heat-card .pub-name,
      .pub-heat-card .pub-time,
      .pub-heat-card .pub-pos {
        font-size: var(--pub-fs-small);
      }
      .pub-battery.pub-card .pub-thead,
      .pub-battery.pub-card .pub-trow {
        grid-template-columns:
          minmax(max-content, 0.5fr)
          minmax(0, 2.6fr)
          minmax(max-content, 0.9fr);
      }
      .pub-marathon.pub-card .pub-thead,
      .pub-marathon.pub-card .pub-trow {
        grid-template-columns:
          minmax(max-content, 0.5fr)
          minmax(0, 2.4fr)
          minmax(max-content, 0.7fr);
      }
      .pub-selection {
        max-width: 720px;
        margin: 0 auto;
        width: 100%;
      }
      .pub-select-card {
        display: block;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: var(--pub-pad);
        margin-bottom: max(1vh, 8px);
        color: var(--text);
        font-size: var(--pub-fs-label);
        font-weight: 700;
        text-align: left;
      }
      .pub-select-card small {
        display: block;
        color: var(--muted);
        font-size: var(--pub-fs-small);
        font-weight: 400;
        margin-top: 0.2em;
      }
      .pub-select-card:hover {
        border-color: var(--cyan);
      }
      .pub-overlay {
        position: fixed;
        right: 18px;
        bottom: 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        z-index: 50;
      }
      .pub-overlay[hidden] {
        display: none;
      }
      .pub-fs {
        background: rgba(26, 29, 39, 0.75);
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 22px;
        line-height: 1;
        min-height: 0;
      }
      .pub-overlay .dot {
        width: 12px;
        height: 12px;
      }
      .muted {
        color: var(--muted);
      }
      #pub-stage .team-logo.small {
        max-height: var(--pub-fs-small);
        max-width: calc(var(--pub-fs-small) * 2);
        flex: none;
        vertical-align: middle;
        margin-right: 0.35em;
      }
      @media (max-width: 1400px) {
        .pub-head-chips {
          max-width: 54vw;
        }
      }
      @media (max-width: 900px) {
        .pub-interval {
          grid-template-columns: 1fr;
        }
        .pub-heat-cards[data-cols="3"] {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="pub-bg"></div>
    <main id="pub-stage"></main>
    <div class="pub-overlay" id="pub-overlay" hidden>
      <span class="dot offline" id="pub-dot"></span>
      <button class="pub-fs" id="pub-fullscreen" title="Tela cheia">⛶</button>
    </div>

    <script src="/static/clock_logic.js"></script>
    <script src="/static/sequence_logic.js"></script>
    <script src="/static/common/labels.js"></script>
    <script src="/static/results_logic.js"></script>
    <script src="/static/public_presentation_logic.js"></script>
    <script src="/static/pagination_logic.js"></script>
    <script src="/static/theme_logic.js"></script>
    <script type="module" src="/static/publico.js"></script>
  </body>
</html>
