<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071019" />
    <title>SwimTimer — Admin</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app">
      <div class="topbar">
        <div class="brand">Swim<span>Timer</span> · Admin</div>
        <span class="badge offline" id="conn-badge">offline</span>
      </div>

      <div class="panel">
        <h2>Competição atual</h2>
        <p id="competition-info" class="muted">Nenhuma competição</p>
        <div class="clock small" id="clock">00:00:00</div>
      </div>

      <div class="panel">
        <h2>Criar competição</h2>
        <div class="grid">
          <div>
            <label for="comp-name">Nome</label>
            <input id="comp-name" type="text" placeholder="Festival Infantil SESI" />
          </div>
          <div>
            <label for="comp-event">Tipo de evento</label>
            <select id="comp-event">
              <option value="maratona">Maratona Aquática</option>
              <option value="bateria">Bateria Cronometrada</option>
            </select>
          </div>
          <div class="row">
            <div style="flex: 1">
              <label for="comp-hours">Duração (horas)</label>
              <input id="comp-hours" type="number" min="0.1" step="0.5" value="3" />
            </div>
            <div style="flex: 1">
              <label for="comp-meters">Metros por comprimento</label>
              <select id="comp-meters">
                <option value="25">25 m</option>
                <option value="50" selected>50 m</option>
              </select>
            </div>
          </div>
          <div id="distance-field" hidden>
            <label for="comp-distance">Distância da prova (m)</label>
            <select id="comp-distance">
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200">200</option>
              <option value="400">400</option>
              <option value="800">800</option>
              <option value="1500">1500</option>
            </select>
          </div>
          <button class="primary" id="btn-create-comp">Criar competição</button>
        </div>
      </div>

      <div class="panel">
        <h2>Equipes</h2>
        <div class="row">
          <input id="team-name" type="text" placeholder="Nome da equipe" />
          <button id="btn-add-team">Adicionar</button>
        </div>
        <div class="list" id="team-list" style="margin-top: 12px"></div>
      </div>

      <div class="panel">
        <h2>Raias</h2>
        <div class="lane-grid" id="lane-grid"></div>
      </div>

      <div class="panel">
        <h2>Controle do cronômetro</h2>
        <div class="actions">
          <button class="primary" id="btn-start">INICIAR PROVA</button>
          <button id="btn-pause">PAUSAR</button>
          <button class="danger" id="btn-reset">ZERAR (senha)</button>
        </div>
      </div>
    </main>

    <div class="modal-overlay" id="reset-modal">
      <div class="modal">
        <h2>Senha de reset</h2>
        <input id="reset-password" type="password" placeholder="Senha" />
        <div class="row" style="margin-top: 12px">
          <button style="flex: 1" id="btn-reset-cancel">Cancelar</button>
          <button style="flex: 1" class="danger" id="btn-reset-confirm">Zerar</button>
        </div>
      </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
      const els = {
        badge: document.getElementById("conn-badge"),
        info: document.getElementById("competition-info"),
        clock: document.getElementById("clock"),
        name: document.getElementById("comp-name"),
        event: document.getElementById("comp-event"),
        hours: document.getElementById("comp-hours"),
        meters: document.getElementById("comp-meters"),
        distance: document.getElementById("comp-distance"),
        distanceField: document.getElementById("distance-field"),
        createComp: document.getElementById("btn-create-comp"),
        teamName: document.getElementById("team-name"),
        addTeam: document.getElementById("btn-add-team"),
        teamList: document.getElementById("team-list"),
        laneGrid: document.getElementById("lane-grid"),
        start: document.getElementById("btn-start"),
        pause: document.getElementById("btn-pause"),
        reset: document.getElementById("btn-reset"),
        modal: document.getElementById("reset-modal"),
        password: document.getElementById("reset-password"),
        resetConfirm: document.getElementById("btn-reset-confirm"),
        resetCancel: document.getElementById("btn-reset-cancel"),
      };

      let latestState = null;
      let timerState = { elapsed_s: 0, remaining_s: 0 };

      async function api(path, options) {
        const response = await fetch(path, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        if (!response.ok) {
          let detail = response.statusText;
          try {
            const body = await response.json();
            detail = body.detail || detail;
          } catch (error) {
            /* noop */
          }
          throw new Error(detail);
        }
        if (response.status === 204) return null;
        return response.json();
      }

      function renderClock() {
        els.clock.textContent = formatClock(timerState.elapsed_s);
      }

      function renderCompetition() {
        if (!latestState || !latestState.competition) {
          els.info.textContent = "Nenhuma competição";
          return;
        }
        const comp = latestState.competition;
        const hours = (comp.duration_s / 3600).toFixed(1);
        const type = (comp.event_type || "maratona") === "bateria" ? "bateria" : "maratona";
        let info = `${comp.name} · ${type} · status ${comp.status}`;
        if (type === "bateria") {
          info += ` · ${comp.distance_m} m`;
        } else {
          info += ` · ${hours} h · ${comp.meters_lap} m`;
        }
        els.info.textContent = info;
      }

      function renderTeams() {
        const teams = (latestState && latestState.teams) || [];
        els.teamList.innerHTML = "";
        if (!teams.length) {
          els.teamList.innerHTML = '<p class="muted">Nenhuma equipe cadastrada.</p>';
          return;
        }
        for (const team of teams) {
          const item = document.createElement("div");
          item.className = "list-item";
          item.innerHTML = `<span>${team.name}</span>`;
          els.teamList.appendChild(item);
        }
      }

      function isBateria() {
        return (
          latestState &&
          latestState.competition &&
          (latestState.competition.event_type || "maratona") === "bateria"
        );
      }

      function renderLanes() {
        const lanes = (latestState && latestState.lanes) || [];
        const teams = (latestState && latestState.teams) || [];
        const battery = isBateria();
        els.laneGrid.innerHTML = "";
        if (!lanes.length) {
          els.laneGrid.innerHTML = '<p class="muted">Crie uma competição para gerar as raias.</p>';
          return;
        }
        for (const lane of lanes) {
          const cell = document.createElement("div");
          cell.className = "lane-cell";
          const title = document.createElement("div");
          title.className = "lane-title";
          title.textContent = `Raia ${lane.number} · ${lane.laps} voltas`;

          const select = document.createElement("select");
          const empty = document.createElement("option");
          empty.value = "";
          empty.textContent = "— sem equipe —";
          select.appendChild(empty);
          for (const team of teams) {
            const option = document.createElement("option");
            option.value = team.id;
            option.textContent = team.name;
            select.appendChild(option);
          }
          select.value = lane.team_id || "";

          let participant = null;
          if (battery) {
            participant = document.createElement("input");
            participant.type = "text";
            participant.placeholder = "Nome do participante";
            participant.value = lane.participant_name || "";
            participant.addEventListener("change", () =>
              assignLane(lane.id, select.value || null, participant.value)
            );
          }

          select.addEventListener("change", () =>
            assignLane(lane.id, select.value || null, participant ? participant.value : undefined)
          );

          cell.appendChild(title);
          if (participant) cell.appendChild(participant);
          cell.appendChild(select);
          els.laneGrid.appendChild(cell);
        }
      }

      function applyState(state) {
        latestState = state;
        if (state.timer) timerState = state.timer;
        renderClock();
        renderCompetition();
        renderTeams();
        renderLanes();
      }

      async function createCompetition() {
        const name = els.name.value.trim();
        const hours = Number(els.hours.value);
        if (!name) return showToast("Informe o nome da competição", true);
        if (!hours || hours <= 0) return showToast("Duração inválida", true);
        const eventType = els.event.value;
        const payload = {
          name,
          duration_s: Math.round(hours * 3600),
          meters_lap: Number(els.meters.value),
          event_type: eventType,
          distance_m: Number(els.distance.value),
        };
        try {
          await api("/api/competition", {
            method: "POST",
            body: JSON.stringify(payload),
          });
          els.name.value = "";
          showToast("Competição criada");
        } catch (error) {
          showToast(`Erro: ${error.message}`, true);
        }
      }

      async function addTeam() {
        if (!latestState || !latestState.competition) {
          return showToast("Crie uma competição primeiro", true);
        }
        const name = els.teamName.value.trim();
        if (!name) return showToast("Informe o nome da equipe", true);
        try {
          await api("/api/team", {
            method: "POST",
            body: JSON.stringify({ competition_id: latestState.competition.id, name }),
          });
          els.teamName.value = "";
          showToast("Equipe adicionada");
        } catch (error) {
          showToast(`Erro: ${error.message}`, true);
        }
      }

      async function assignLane(laneId, teamId, participantName) {
        try {
          await api(`/api/lane/${laneId}/assign`, {
            method: "POST",
            body: JSON.stringify({
              team_id: teamId,
              participant_name: participantName,
            }),
          });
        } catch (error) {
          showToast(`Erro: ${error.message}`, true);
        }
      }

      function openResetModal() {
        els.password.value = "";
        els.modal.classList.add("open");
        els.password.focus();
      }

      const ws = new WSClient(wsUrl(), (message) => {
        if (message.type === "state") {
          applyState(message);
        } else if (message.type === "tick") {
          timerState = message;
          renderClock();
        } else if (message.type === "error") {
          showToast(`Erro: ${message.message}`, true);
        }
      });

      ws.onStatusChange = (connected) => {
        els.badge.classList.toggle("online", connected);
        els.badge.classList.toggle("offline", !connected);
        els.badge.textContent = connected ? "online" : "offline";
      };

      els.event.addEventListener("change", () => {
        els.distanceField.hidden = els.event.value !== "bateria";
      });

      els.createComp.addEventListener("click", createCompetition);
      els.addTeam.addEventListener("click", addTeam);
      els.start.addEventListener("click", () => {
        if (!ws.send({ type: "timer_start" })) showToast("Sem conexão", true);
      });
      els.pause.addEventListener("click", () => {
        if (!ws.send({ type: "timer_pause" })) showToast("Sem conexão", true);
      });
      els.reset.addEventListener("click", openResetModal);
      els.resetCancel.addEventListener("click", () => els.modal.classList.remove("open"));
      els.resetConfirm.addEventListener("click", () => {
        const password = els.password.value;
        if (!ws.send({ type: "timer_reset", password })) {
          showToast("Sem conexão", true);
          return;
        }
        els.modal.classList.remove("open");
      });

      renderClock();
      ws.connect();
    </script>
  </body>
</html>
