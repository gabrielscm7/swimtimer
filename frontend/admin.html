<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwimTimer — Administração</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script>
      const params = new URLSearchParams(window.location.search);
      const eventId = params.get("event");
      const target = eventId
        ? `gestao.html?event=${encodeURIComponent(eventId)}`
        : "index.html";
      window.location.replace(target);
    </script>
  </head>
  <body>
    <main class="app">
      <div class="panel">
        <h2>Administração</h2>
        <p class="muted">
          A administração foi integrada à tela de gestão.
        </p>
        <p><a id="admin-link" href="index.html">Continuar</a></p>
      </div>
    </main>
    <script>
      document.getElementById("admin-link").href = target;
    </script>
  </body>
</html>
