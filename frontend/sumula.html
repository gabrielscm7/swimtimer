<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwimTimer — Súmula</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e9edf3;
        color: #111;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      .sheet {
        max-width: 820px;
        margin: 24px auto;
        background: #fff;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0;
      }
      h2 {
        font-size: 1rem;
        font-weight: 500;
        margin: 4px 0 16px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        font-size: 0.82rem;
        color: #444;
        margin-bottom: 14px;
      }
      .badge {
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .badge.official {
        color: #047857;
      }
      .badge.corrected {
        color: #0369a1;
      }
      .badge.provisional {
        color: #b45309;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      th,
      td {
        border: 1px solid #333;
        padding: 6px 8px;
        text-align: left;
      }
      th {
        background: #f1f3f6;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      td.time {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .signatures {
        display: flex;
        gap: 32px;
        margin-top: 52px;
        font-size: 0.8rem;
      }
      .signatures div {
        flex: 1;
        border-top: 1px solid #333;
        padding-top: 5px;
      }
      .toolbar {
        max-width: 820px;
        margin: 16px auto -8px;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        padding: 0 8px;
      }
      .toolbar a,
      .toolbar button {
        border: 1px solid #9aa4b2;
        background: #fff;
        color: #111;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 0.9rem;
        text-decoration: none;
        cursor: pointer;
      }
      .message {
        max-width: 820px;
        margin: 40px auto;
        background: #fff;
        padding: 28px;
        text-align: center;
        color: #444;
      }
      @media print {
        body {
          background: #fff;
        }
        .no-print {
          display: none !important;
        }
        .sheet {
          margin: 0;
          max-width: none;
          box-shadow: none;
          padding: 8mm;
        }
        @page {
          margin: 10mm;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar no-print">
      <a href="resultados.html" id="sum-back">← Resultados</a>
      <button id="sum-print" type="button">Imprimir</button>
    </div>
    <div id="sum-content"></div>
    <script type="module" src="/static/sumula.js"></script>
  </body>
</html>
